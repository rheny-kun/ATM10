<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATM10 Enchantments 早見表</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./site.js" defer></script>
  </head>
  <body class="enchantment-page">
    <header class="site-header">
      <div class="container">
        <h1>ATM10 Enchantments 早見表</h1>
        <p class="subtitle">All the Mods 10 8.2 / Minecraft 1.21.1 / NeoForge</p>
        <nav class="site-nav" aria-label="サイト内ナビゲーション">
          <button
            class="site-nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav-links"
            aria-label="メニューを開く"
          >
            <span aria-hidden="true">☰</span>
          </button>
          <div class="site-nav-links" id="site-nav-links">
            <a href="./index.html">Relics / Artifacts</a>
            <a href="./enchantments.html" class="active" aria-current="page">Enchantments</a>
          </div>
        </nav>
      </div>
    </header>

    <section class="filter-bar">
      <div class="container filters">
        <input
          id="search"
          class="control"
          type="search"
          placeholder="日本語名・英語名・ID・効果を検索…"
          autocomplete="off"
        />
        <select id="modFilter" class="control">
          <option value="">すべてのMOD</option>
        </select>
        <select id="categoryFilter" class="control">
          <option value="">すべての装備カテゴリ</option>
        </select>
      </div>
    </section>

    <main class="container">
      <div class="table-wrap enchantment-table">
        <table>
          <colgroup>
            <col class="enchant-name-col" />
            <col class="enchant-equipment-col" />
            <col class="enchant-effect-col" />
            <col class="enchant-conflicts-col" />
          </colgroup>
          <thead>
            <tr>
              <th>名前 / MOD</th>
              <th>対応装備</th>
              <th>効果</th>
              <th>競合</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </main>

    <script src="./enchantments-data.js"></script>
    <script src="./enchantments.js"></script>
  </body>
</html>
