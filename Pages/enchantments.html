<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATM10 Enchantments 早見表</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./site.js" defer></script>
  </head>
  <body class="enchantment-page">
    <header class="site-header">
      <div class="container">
        <h1>ATM10 Enchantments 早見表</h1>
        <p class="subtitle">All the Mods 10 8.2 / Minecraft 1.21.1 / NeoForge</p>
        <nav class="site-nav" aria-label="サイト内ナビゲーション">
          <button
            class="site-nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav-links"
            aria-label="メニューを開く"
          >
            <span aria-hidden="true">☰</span>
          </button>
          <div class="site-nav-links" id="site-nav-links">
            <a href="./index.html">Relics / Artifacts</a>
            <a href="./enchantments.html" aria-current="page">Enchantments</a>
          </div>
        </nav>
      </div>
    </header>

    <section class="filter-bar">
      <div class="container filters">
        <input
          id="search"
          class="control"
          type="search"
          placeholder="日本語名・英語名・ID・効果を検索…"
          autocomplete="off"
        />
        <select id="modFilter" class="control">
          <option value="">すべてのMOD</option>
        </select>
        <select id="categoryFilter" class="control">
          <option value="">すべての装備カテゴリ</option>
        </select>
        <select id="curseFilter" class="control">
          <option value="">Curse / 通常</option>
          <option value="curse">Curse</option>
          <option value="normal">通常</option>
        </select>
      </div>
    </section>

    <main class="container">
      <div id="summary" class="summary" aria-live="polite"></div>
      <div class="table-wrap enchantment-table">
        <table>
          <colgroup>
            <col class="enchant-name-col" />
            <col class="enchant-equipment-col" />
            <col class="enchant-effect-col" />
            <col class="enchant-conflicts-col" />
          </colgroup>
          <thead>
            <tr>
              <th>名前 / MOD</th>
              <th>対応装備</th>
              <th>効果</th>
              <th>競合</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="note">
        全117件。登録されていてもパック側で無効なもの（例: 鉱夫の熱情）は
        「入手不可 / technical」として残しています。効果欄はMinecraft 1.21.1の仕様と、
        各MODの1.21.1ソース・公式ドキュメント・ATM10設定を照合したプレイヤー向け説明です。
      </p>
    </main>

    <script src="./enchantments-data.js"></script>
    <script src="./enchantments.js"></script>
    <script>
      (() => {
        document.documentElement.classList.add("has-nav-js");

        const nav = document.querySelector(".site-nav");
        const toggle = nav?.querySelector(".site-nav-toggle");
        const links = nav?.querySelector(".site-nav-links");

        if (!nav || !toggle || !links) return;

        const setOpen = (open) => {
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute(
            "aria-label",
            open ? "メニューを閉じる" : "メニューを開く",
          );
          links.classList.toggle("is-open", open);
        };

        setOpen(false);
        toggle.addEventListener("click", () => {
          setOpen(toggle.getAttribute("aria-expanded") !== "true");
        });
        links.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => setOpen(false));
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") setOpen(false);
        });
        document.addEventListener("click", (event) => {
          if (!nav.contains(event.target)) setOpen(false);
        });

        const media = window.matchMedia("(min-width: 701px)");
        media.addEventListener?.("change", () => setOpen(false));
      })();
    </script>
  </body>
</html>
