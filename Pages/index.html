<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ATM10 Relics / Artifacts 早見表</title>

    <style>
      :root {
        --bg: #090c12;
        --bg-soft: #0d121a;
        --panel: rgba(18, 24, 34, 0.88);
        --panel-hover: rgba(25, 33, 46, 0.96);
        --header: #141b26;
        --border: rgba(148, 163, 184, 0.14);
        --border-strong: rgba(148, 163, 184, 0.24);

        --text: #e8edf5;
        --muted: #8e9aaa;
        --link: #9ac7ff;

        --artifact: #f0c46b;
        --artifact-bg: rgba(240, 196, 107, 0.09);
        --artifact-border: rgba(240, 196, 107, 0.28);

        --relic: #cda6ff;
        --relic-bg: rgba(205, 166, 255, 0.09);
        --relic-border: rgba(205, 166, 255, 0.28);

        --rank: #bca7ff;
        --accent: #6ee7a8;

        --radius: 14px;
        --shadow:
          0 12px 36px rgba(0, 0, 0, 0.22),
          inset 0 1px 0 rgba(255, 255, 255, 0.025);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        background:
          radial-gradient(
            circle at 15% -10%,
            rgba(80, 130, 210, 0.12),
            transparent 35rem
          ),
          radial-gradient(
            circle at 95% 0%,
            rgba(100, 230, 170, 0.07),
            transparent 30rem
          ),
          var(--bg);

        font-family:
          Inter,
          "Noto Sans JP",
          "Hiragino Sans",
          "Yu Gothic UI",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        line-height: 1.65;
      }

      a {
        color: inherit;
      }

      /* ---------- Header ---------- */

      .site-header {
        padding: 42px 24px 31px;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(
          180deg,
          rgba(18, 28, 42, 0.82),
          rgba(9, 12, 18, 0.22)
        );
      }

      .container {
        width: min(1480px, calc(100% - 32px));
        margin-inline: auto;
      }

      h1 {
        margin: 0;
        font-size: clamp(27px, 4vw, 42px);
        line-height: 1.18;
        letter-spacing: -0.035em;
        font-weight: 760;

        background: linear-gradient(105deg, #f5f8fc 10%, #b9d9ff 58%, #8ef0b8);

        color: transparent;
        background-clip: text;
        -webkit-background-clip: text;
      }

      .subtitle {
        margin: 9px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .site-nav {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 16px;
        flex-wrap: wrap;
        position: relative;
      }

      .site-nav-toggle {
        display: none;
        min-width: 44px;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        color: var(--text);
        background: rgba(16, 25, 36, 0.8);
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        font-size: 22px;
        line-height: 1;
        cursor: pointer;
      }

      .site-nav-toggle:hover,
      .site-nav-toggle:focus-visible,
      .site-nav a {
        color: var(--link);
      }

      .site-nav-toggle:hover,
      .site-nav-toggle:focus-visible {
        border: 1px solid var(--border-strong);
        background: var(--panel-hover);
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .site-nav-links {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .site-nav a {
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 6px 12px;
        text-decoration: none;
        background: rgba(16, 25, 36, 0.8);
      }

      .site-nav a:hover,
      .site-nav a:focus-visible {
        background: var(--panel-hover);
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      .site-nav a[aria-current="page"] {
        color: #07110c;
        background: var(--accent);
        border-color: var(--accent);
        font-weight: 700;
      }

      /* ---------- Filters ---------- */

      .filter-bar {
        position: sticky;
        top: 0;
        z-index: 30;

        padding: 11px 0;

        border-bottom: 1px solid var(--border);
        background: rgba(9, 12, 18, 0.82);
        backdrop-filter: blur(16px) saturate(140%);
        -webkit-backdrop-filter: blur(16px) saturate(140%);
      }

      .filters {
        display: grid;
        grid-template-columns:
          minmax(260px, 1fr)
          minmax(180px, 235px)
          minmax(160px, 210px);

        gap: 10px;
      }

      .control {
        width: 100%;
        min-width: 0;

        color: var(--text);
        background: rgba(17, 23, 33, 0.92);

        border: 1px solid var(--border-strong);
        border-radius: 10px;

        padding: 10px 12px;

        font: inherit;
        font-size: 13px;

        outline: none;

        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          box-shadow 0.15s ease;
      }

      .control:hover {
        background: rgba(23, 31, 43, 0.96);
      }

      .control:focus {
        border-color: rgba(119, 182, 255, 0.62);
        box-shadow: 0 0 0 3px rgba(94, 164, 255, 0.1);
      }

      .control::placeholder {
        color: #657183;
      }

      /* ---------- Main ---------- */

      main {
        padding: 30px 0 80px;
      }

      .slot-section {
        margin: 0 0 48px;
      }

      .slot-title {
        display: flex;
        align-items: center;
        gap: 11px;

        margin: 0 0 13px;

        font-size: 21px;
        letter-spacing: -0.02em;
      }

      .slot-title::before {
        content: "";
        width: 5px;
        height: 23px;
        flex: 0 0 5px;

        border-radius: 10px;
        background: linear-gradient(180deg, #84d4ff, #78efaa);

        box-shadow: 0 0 16px rgba(108, 221, 189, 0.22);
      }

      /* ---------- Table ---------- */

      .table-shell {
        overflow: hidden;

        border: 1px solid var(--border);
        border-radius: var(--radius);

        background: var(--panel);
        box-shadow: var(--shadow);
      }

      .table-scroll {
        overflow-x: auto;
      }

      table {
        width: 100%;
        min-width: 1120px;

        border-collapse: collapse;
        table-layout: fixed;
      }

      col.name-col {
        width: 270px;
      }

      col.effect-col {
        width: 30%;
      }

      col.rank-col {
        width: 36%;
      }

      col.xp-col {
        width: auto;
      }

      th,
      td {
        padding: 15px 17px;
        text-align: left;
        vertical-align: top;

        border-bottom: 1px solid var(--border);
      }

      th {
        /* Stickyにしない。
     上部フィルターと重ならないよう通常配置にする。 */
        position: static;

        color: #bfc9d7;
        background: rgba(25, 32, 43, 0.98);

        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.035em;
      }

      tbody tr {
        transition: background 0.12s ease;
      }

      tbody tr:hover {
        background: var(--panel-hover);
      }

      tbody tr:last-child td {
        border-bottom: 0;
      }

      /* ---------- Item ---------- */

      .item {
        display: flex;
        align-items: center;
        gap: 13px;
      }

      .icon-frame {
        position: relative;

        display: grid;
        place-items: center;

        width: 58px;
        height: 58px;
        flex: 0 0 58px;

        overflow: hidden;

        border: 1px solid var(--border-strong);
        border-radius: 12px;

        background:
          linear-gradient(
            145deg,
            rgba(255, 255, 255, 0.035),
            rgba(255, 255, 255, 0.008)
          ),
          #090d13;

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.03),
          0 5px 15px rgba(0, 0, 0, 0.18);
      }

      .icon-frame img,
      .icon-frame canvas {
        display: block;

        width: 48px;
        height: 48px;

        max-width: 48px;
        max-height: 48px;

        object-fit: contain;

        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .icon-frame canvas {
        object-fit: contain;
      }

      .icon-frame img[hidden],
      .icon-frame canvas[hidden] {
        display: none;
      }

      .icon-frame img.pending-image {
        visibility: hidden;
      }

      .icon-fallback {
        display: none;

        color: #5f6a79;
        font-size: 9px;
        font-weight: 800;
        line-height: 1.05;
        text-align: center;
        letter-spacing: 0.05em;
      }

      .item-main {
        min-width: 0;
      }

      .item-name {
        display: inline-block;

        color: #f2f6fb;
        font-weight: 720;
        font-size: 15px;
        line-height: 1.3;

        text-decoration: none;

        transition:
          color 0.12s ease,
          text-shadow 0.12s ease;
      }

      .item-name:hover {
        color: var(--link);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .item-id {
        margin-top: 4px;

        color: #657183;
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;

        font-size: 10px;
        word-break: break-all;
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;

        margin-top: 7px;
      }

      .tag {
        display: inline-flex;
        align-items: center;

        padding: 2px 7px;

        border: 1px solid;
        border-radius: 999px;

        font-size: 10px;
        font-weight: 680;
        line-height: 1.5;
      }

      .tag-artifacts {
        color: var(--artifact);
        background: var(--artifact-bg);
        border-color: var(--artifact-border);
      }

      .tag-relics {
        color: var(--relic);
        background: var(--relic-bg);
        border-color: var(--relic-border);
      }

      /* ---------- Rank ---------- */

      .rank-list {
        margin: 0;
        padding-left: 19px;
      }

      .rank-list li + li {
        margin-top: 6px;
      }

      .rank-label {
        color: var(--rank);
        font-weight: 760;
      }

      .no-rank {
        color: var(--muted);
      }

      /* ---------- Text ---------- */

      td {
        color: #d3d9e2;
        font-size: 13px;
      }

      .empty {
        padding: 50px 20px;

        color: var(--muted);
        text-align: center;

        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
      }

      /* ---------- Responsive ---------- */

      @media (max-width: 820px) {
        .site-header {
          padding: 30px 16px 24px;
        }

        .container {
          width: min(100% - 22px, 1480px);
        }

        .filters {
          grid-template-columns: 1fr 1fr;
        }

        #search {
          grid-column: 1 / -1;
        }

        main {
          padding-top: 22px;
        }
      }

      @media (max-width: 700px) {
        .site-nav {
          display: block;
        }

        .has-nav-js .site-nav-toggle {
          display: inline-flex;
        }

        .has-nav-js .site-nav-links {
          display: none;
          flex-direction: column;
          gap: 4px;
          margin-top: 8px;
          padding: 8px;
          border: 1px solid var(--border-strong);
          border-radius: 10px;
          background: var(--header);
          box-shadow: var(--shadow);
        }

        .has-nav-js .site-nav-links.is-open {
          display: flex;
        }

        .site-nav-links a {
          border-radius: 7px;
          padding: 9px 11px;
        }
      }

      @media (max-width: 520px) {
        .filters {
          grid-template-columns: 1fr;
        }

        #search {
          grid-column: auto;
        }
      }
    </style>

  </head>

            ["R3", "Meatball使用時にHP回復"],
            ["R5", "Cooked MeatballとしてDrop"],

        ],

        /* ----- Ring ----- */

        [
          "指輪",
          "Relics",
          "ring_of_the_seven_deadly_sins",
          "Ring of the Seven Deadly Sins",
          "Pride・Envy・Wrath・Sloth・Greed・Gluttony・Lustの7能力を持つ。",
          [],
          "各Sin固有の条件で成長する。高低差戦闘、HP差、採掘、Loot、食事、繁殖など。",
        ],

        /* ----- Utility ----- */

        [
          "Charm / Utility",
          "Relics",
          "chorus_staff",
          "Chorus Staff",
          "視線方向へ短距離TeleportするActive Relic。",
          [
            ["R1", "Teleport先周囲の敵がターゲットを失う"],
            ["R3", "Teleport後の落下ダメージを防ぐ"],
            ["R5", "視線先Blockへの精密Teleport"],
          ],
          "Teleport、ターゲット解除、安全着地能力を利用する。",
        ],

        [
          "Charm / Utility",
          "Relics",
          "sphere_of_self_sacrifice",
          "Sphere of Self-Sacrifice",
          "最大HPの一部を代償として支払い、その後より多くのHPを時間経過で取り戻す。",
          [
            ["R1", "回復Stack数に応じ被ダメージ軽減"],
            ["R3", "残った回復量をBlood Projectileへ変換"],
            ["R5", "大ダメージを抑え回復Stackへ変換"],
          ],
          "能力を使用する。能力でダメージを軽減・無効化する。",
        ],

        [
          "Charm / Utility",
          "Relics",
          "clot_of_time",
          "Clot of Time",
          "直近数秒の自分の移動経路を巻き戻す。",
          [
            ["R1", "Rewind中のダメージを無効化"],
            ["R3", "周囲の敵が自分を見失う"],
            ["R5", "過去のより高いHPへ巻き戻せる"],
          ],
          "Rewindを利用する。HPを復元する。",
        ],

        [
          "Charm / Utility",
          "Relics",
          "rider_flute",
          "Rider Flute",
          "Tame済みの騎乗Mobを収納・召喚・Recallできる。",
          [
            ["R1", "収納中のMountを回復"],
            ["R3", "離れすぎたMountを自動Recall"],
            ["R5", "騎乗中、双方の被ダメージ軽減"],
          ],
          "騎乗移動、Mount回復、Recall、ダメージ軽減を利用する。",
        ],

        [
          "Charm / Utility",
          "Relics",
          "experience_disperser",
          "Experience Disperser",
          "ひとつのRelicが獲得したXPの一部を他の装備中Relicへ分配する。",
          [
            ["R1", "経験値分配性能を強化"],
            ["R3", "Minecraft XPの一部もRelic成長へ利用"],
            ["R5", "XP元Relicが最大でも分配可能"],
          ],
          "他のRelicへRelic XPを分配する。",
        ],

        [
          "手持ち / Shield",
          "Relics",
          "shield_of_retaliation",
          "Shield of Retaliation",
          "短いParry Windowで正面攻撃を完全防御する。",
          [
            ["R1", "Projectileを停止・反射"],
            ["R3", "Parry成功時に前方の敵をStun"],
            ["R5", "Parry Window中の防御対象を拡張"],
          ],
          "Parryでダメージを防ぐ。Stunを成功させる。",
        ],
      ];

      /* =========================================================
   Rendering
   ========================================================= */

      const slotOrder = [
        "頭",
        "背中",
        "首飾り",
        "腰",
        "手",
        "足",
        "指輪",
        "チャーム",
        "手持ち",
        "手持ち / Utility",
      ];

      const search = document.getElementById("search");

      const slotFilter = document.getElementById("slotFilter");

      const modFilter = document.getElementById("modFilter");

      const content = document.getElementById("content");

      const summary = document.getElementById("summary");

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function toItem(raw) {
        const [slot, mod, id, name, main, ranks, xp] = raw;
        const metadata = window.RELICS_PUBLIC?.get(mod, id, slot) ?? {
          registry: `${mod.toLowerCase()}:${id}`,
          originMod: mod,
          behaviorMod: mod,
          slotLabel: slot,
          curiosSlot: "—",
          maxLevel: null,
          maxRank: null,
          quality: null,
          abilities: [],
          leveling: "テンプレート情報なし",
        };

        return {
          rawSlot: slot,
          slot: metadata.slotLabel,
          mod,
          id,
          name,
          main,
          ranks,
          xp,
          ...metadata,
        };
      }

      function docsUrl(item) {
        if (item.mod === "Artifacts") {
          return URLS.artifactDocs + encodeURIComponent(item.id) + "/";
        }

        return URLS.relicDocs + encodeURIComponent(item.id) + "/";
      }

      const IMAGE_ID_ALIASES = {
        Artifacts: {
          umbrella: "umbrella_held",
        },
        Relics: {
          clot_of_time: "clot_of_time_enabled",
          midnight_mantle: "midnight_mantle_full_moon",
          rider_flute: "rider_flute_empty",
          sphere_of_self_sacrifice: "sphere_of_self_sacrifice_0",
        },
      };

      function imageCandidates(item) {
        const base =
          item.mod === "Artifacts" ? URLS.artifactImages : URLS.relicImages;
        const imageId = IMAGE_ID_ALIASES[item.mod]?.[item.id] ?? item.id;

        return {
          gif: base + imageId + ".gif",
          png: base + imageId + ".png",
          mcmeta: base + imageId + ".png.mcmeta",
        };
      }

      const imageLoadCache = new Map();

      const animationMetaCache = new Map();

      const activeAnimations = new Set();

      const animationControllers = new Map();

      let imageObserver = null;

      let animationObserver = null;

      let renderVersion = 0;

      function loadImage(url) {
        if (!imageLoadCache.has(url)) {
          imageLoadCache.set(
            url,
            new Promise((resolve, reject) => {
              const image = new Image();

              image.decoding = "async";

              image.onload = () => resolve(image);

              image.onerror = () => reject(new Error(`画像を読み込めません: ${url}`));

              image.src = url;
            }),
          );
        }

        return imageLoadCache.get(url);
      }

      function loadAnimationMeta(url) {
        if (!animationMetaCache.has(url)) {
          animationMetaCache.set(
            url,
            fetch(url, { mode: "cors" })
              .then((response) => {
                if (!response.ok) {
                  throw new Error(`mcmetaを読み込めません: ${response.status}`);
                }

                return response.json();
              })
              .catch(() => null),
          );
        }

        return animationMetaCache.get(url);
      }

      function isCurrentImage(img, version) {
        return version === renderVersion && img.isConnected;
      }

      function showFallback(img) {
        const frame = img.closest(".icon-frame");
        const canvas = frame?.querySelector(".item-canvas");
        const fallback = frame?.querySelector(".icon-fallback");

        img.classList.remove("pending-image");

        img.hidden = true;

        if (canvas) {
          canvas.hidden = true;
        }

        if (fallback) {
          fallback.style.display = "block";
        }
      }

      function showStaticImage(img, url) {
        const frame = img.closest(".icon-frame");
        const canvas = frame?.querySelector(".item-canvas");
        const fallback = frame?.querySelector(".icon-fallback");

        img.classList.remove("pending-image");

        img.src = url;

        img.hidden = false;

        if (canvas) {
          canvas.hidden = true;
        }

        if (fallback) {
          fallback.style.display = "none";
        }
      }

      function parseAnimationMeta(meta, frameCount) {
        const animation = meta?.animation;

        if (!animation || frameCount < 2) {
          return null;
        }

        const defaultTime =
          Number.isFinite(animation.frametime) && animation.frametime > 0
            ? animation.frametime
            : 1;

        const sourceFrames =
          Array.isArray(animation.frames) && animation.frames.length
            ? animation.frames
            : Array.from({ length: frameCount }, (_, index) => index);

        const frames = sourceFrames
          .map((entry) => {
            const isObject = entry && typeof entry === "object";
            const index = isObject ? entry.index : entry;
            const time =
              isObject && Number.isFinite(entry.time) && entry.time > 0
                ? entry.time
                : defaultTime;

            return {
              index,
              time,
            };
          })
          .filter(
            (frame) =>
              Number.isInteger(frame.index) &&
              frame.index >= 0 &&
              frame.index < frameCount,
          );

        return frames.length
          ? {
              frames,
              // 補間はピクセルアートをぼかさないため非補間で再生する。
              interpolate: Boolean(animation.interpolate),
            }
          : null;
      }

      function stopAnimation(controller) {
        controller.stopped = true;

        if (controller.timer) {
          window.clearTimeout(controller.timer);
        }

        animationControllers.delete(controller.canvas);

        animationObserver?.unobserve(controller.canvas);

        activeAnimations.delete(controller);
      }

      function stopAllAnimations() {
        for (const controller of activeAnimations) {
          stopAnimation(controller);
        }

        activeAnimations.clear();

        animationControllers.clear();

        imageObserver?.disconnect();

        animationObserver?.disconnect();

        imageObserver = null;

        animationObserver = null;
      }

      function startAnimation(img, canvas, source, animation, version) {
        const context = canvas.getContext("2d");

        if (!context) {
          return false;
        }

        const frameSize = source.naturalWidth;

        canvas.width = frameSize;

        canvas.height = frameSize;

        context.imageSmoothingEnabled = false;

        const controller = {
          canvas,
          index: 0,
          timer: 0,
          stopped: false,
          visible: !animationObserver,
          redraw: null,
          refresh: null,
        };

        const draw = () => {
          if (
            controller.stopped ||
            !isCurrentImage(img, version) ||
            !controller.visible ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          const frame = animation.frames[controller.index];

          context.clearRect(0, 0, frameSize, frameSize);

          context.drawImage(
            source,
            0,
            frame.index * frameSize,
            frameSize,
            frameSize,
            0,
            0,
            frameSize,
            frameSize,
          );
        };

        const schedule = () => {
          if (
            controller.stopped ||
            !controller.visible ||
            document.visibilityState === "hidden"
          ) {
            return;
          }

          const frame = animation.frames[controller.index];

          controller.timer = window.setTimeout(() => {
            controller.index =
              (controller.index + 1) % animation.frames.length;

            draw();

            schedule();
          }, frame.time * 50);
        };

        controller.redraw = () => {
          draw();
          schedule();
        };

        controller.refresh = (visible) => {
          controller.visible = visible;

          if (controller.timer) {
            window.clearTimeout(controller.timer);

            controller.timer = 0;
          }

          if (visible) {
            controller.redraw();
          }
        };

        activeAnimations.add(controller);

        animationControllers.set(canvas, controller);

        if (animationObserver) {
          animationObserver.observe(canvas);
        } else {
          controller.redraw();
        }

        return true;
      }

      async function mountImage(img, item, version) {
        const candidates = imageCandidates(item);

        let gif;

        try {
          gif = await loadImage(candidates.gif);
        } catch {
          gif = null;
        }

        if (!isCurrentImage(img, version)) {
          return;
        }

        if (gif) {
          showStaticImage(img, candidates.gif);

          return;
        }

        let png;

        try {
          png = await loadImage(candidates.png);
        } catch {
          png = null;
        }

        if (!isCurrentImage(img, version)) {
          return;
        }

        if (!png) {
          showFallback(img);

          return;
        }

        const frameCount = Math.floor(png.naturalHeight / png.naturalWidth);

        let meta = null;

        if (frameCount > 1) {
          meta = await loadAnimationMeta(candidates.mcmeta);
        }

        if (!isCurrentImage(img, version)) {
          return;
        }

        const animation = parseAnimationMeta(meta, frameCount);

        if (!animation) {
          showStaticImage(img, candidates.png);

          return;
        }

        const canvas = img.closest(".icon-frame")?.querySelector(".item-canvas");

        if (!canvas) {
          showStaticImage(img, candidates.png);

          return;
        }

        img.hidden = true;

        canvas.hidden = false;

        const fallback = img.closest(".icon-frame")?.querySelector(".icon-fallback");

        if (fallback) {
          fallback.style.display = "none";
        }

        if (!startAnimation(img, canvas, png, animation, version)) {
          showStaticImage(img, candidates.png);
        }
      }

      function observeRenderedImages(images, renderedItems, version) {
        if ("IntersectionObserver" in window) {
          animationObserver = new IntersectionObserver((entries) => {
            for (const entry of entries) {
              animationControllers.get(entry.target)?.refresh(entry.isIntersecting);
            }
          });

          imageObserver = new IntersectionObserver(
            (entries) => {
              for (const entry of entries) {
                if (!entry.isIntersecting) {
                  continue;
                }

                imageObserver?.unobserve(entry.target);

                const index = images.indexOf(entry.target);

                if (index >= 0) {
                  void mountImage(entry.target, renderedItems[index], version);
                }
              }
            },
            { rootMargin: "160px" },
          );

          images.forEach((img) => imageObserver.observe(img));

          return;
        }

        images.forEach((img, index) => {
          void mountImage(img, renderedItems[index], version);
        });
      }

      document.addEventListener("visibilitychange", () => {
        for (const controller of activeAnimations) {
          controller.refresh(document.visibilityState === "visible");
        }
      });

      function modTag(mod) {
        const className = mod === "Artifacts" ? "tag-artifacts" : "tag-relics";

        return `<span class="tag ${className}">` + escapeHtml(mod) + `</span>`;
      }

      function ranksHtml(ranks) {
        if (!ranks || ranks.length === 0) {
          return (
            `<span class="no-rank">` +
            `固有システム / 標準Rank追加効果なし` +
            `</span>`
          );
        }

        return (
          `<ul class="rank-list">` +
          ranks
            .map(
              ([rank, effect]) =>
                `<li>` +
                `<span class="rank-label">` +
                escapeHtml(rank) +
                `</span>` +
                `：` +
                escapeHtml(effect) +
                `</li>`,
            )
            .join("") +
          `</ul>`
        );
      }

      function itemSearchText(item) {
        return [
          item.slot,
          item.rawSlot,
          item.curiosSlot,
          item.mod,
          item.originMod,
          item.behaviorMod,
          item.registry,
          item.id,
          item.name,
          item.main,
          item.xp,
          item.leveling,
          ...item.abilities,
          ...item.ranks.flat(),
        ]
          .join(" ")
          .toLowerCase();
      }

      function humanizeAbility(id) {
        return String(id)
          .replaceAll("_", " ")
          .replace(/\b\w/g, (character) => character.toUpperCase());
      }

      function detailHtml(item) {
        const registry = escapeHtml(item.registry);
        const abilities = item.abilities.length
          ? item.abilities
              .map((ability) => `<span class="ability-chip">${escapeHtml(humanizeAbility(ability))}<small>${escapeHtml(ability)}</small></span>`)
              .join("")
          : `<span class="muted">テンプレート能力を確認できず</span>`;
        const maxLevel = Number.isInteger(item.maxLevel) ? item.maxLevel : 1;
        const levelText = Number.isInteger(item.maxLevel)
          ? `Lv 0 / ${item.maxLevel}`
          : "レベル上限未確認";
        const rankText = Number.isInteger(item.maxRank)
          ? `Rank ${item.maxRank}`
          : "Rank 未確認";

        return `
          <details class="relic-details">
            <summary>詳細 / 育成データ</summary>
            <div class="relic-detail-body">
              <div class="relic-detail-grid">
                <div><span class="detail-label">Registry</span><code>${registry}</code></div>
                <div><span class="detail-label">装備スロット</span><span>${escapeHtml(item.curiosSlot)}</span></div>
                <div><span class="detail-label">由来 / 実装</span><span>${escapeHtml(item.originMod)} / ${escapeHtml(item.behaviorMod)}</span></div>
                <div><span class="detail-label">品質・上限</span><span>Quality ${escapeHtml(item.quality ?? "—")} / ${escapeHtml(rankText)}</span></div>
              </div>
              <div class="detail-section">
                <span class="detail-label">テンプレート能力</span>
                <div class="ability-chips">${abilities}</div>
              </div>
              <div class="detail-section relic-level-control">
                <label for="level-${escapeHtml(item.registry.replaceAll(":", "-"))}">
                  <span class="detail-label">育成レベルの目安</span>
                  <output data-level-output>${escapeHtml(levelText)}</output>
                </label>
                <input
                  id="level-${escapeHtml(item.registry.replaceAll(":", "-"))}"
                  class="relic-level-slider"
                  type="range"
                  min="0"
                  max="${maxLevel}"
                  value="0"
                  step="1"
                  aria-label="${escapeHtml(item.name)}の育成レベル"
                />
              </div>
              <p class="detail-note">${escapeHtml(item.leveling)}</p>
            </div>
          </details>`;
      }

      function rowHtml(item) {
        return `
    <tr data-relic="${escapeHtml(item.registry)}">
      <td>
        <div class="item">

          <div class="icon-frame">
            <img
              class="item-image pending-image"
              alt="${escapeHtml(item.name)}"
              aria-label="${escapeHtml(item.name)}"
              loading="lazy"
              decoding="async"
            >
            <canvas
              class="item-canvas"
              aria-label="${escapeHtml(item.name)}"
              role="img"
              hidden
            ></canvas>
            <span class="icon-fallback">
              NO<br>IMG
            </span>
          </div>

          <div class="item-main">
            <a
              class="item-name"
              href="${docsUrl(item)}"
              target="_blank"
              rel="noopener noreferrer"
            >
              ${escapeHtml(item.name)}
            </a>

            <div class="item-id">
              ${escapeHtml(item.registry)}
            </div>

            <div class="tags">
              ${modTag(item.mod)}
              <span class="tag slot-tag">${escapeHtml(item.slotLabel)}</span>
            </div>
          </div>

        </div>
        ${detailHtml(item)}
      </td>

      <td>
        ${escapeHtml(item.main)}
      </td>

      <td>
        ${ranksHtml(item.ranks)}
      </td>

      <td>
        ${escapeHtml(item.xp)}
      </td>
    </tr>
  `;
      }

      function render() {
        const query = search.value.trim().toLowerCase();

        const selectedSlot = slotFilter.value;

        const selectedMod = modFilter.value;

        const normalized = items.map(toItem);

        const filtered = normalized.filter((item) => {
          if (selectedSlot && item.slot !== selectedSlot) {
            return false;
          }

          if (selectedMod && item.mod !== selectedMod) {
            return false;
          }

          if (query && !itemSearchText(item).includes(query)) {
            return false;
          }

          return true;
        });

        let html = "";
        const renderedItems = [];

        for (const slot of slotOrder) {
          const slotItems = filtered.filter((item) => item.slot === slot);

          if (!slotItems.length) {
            continue;
          }

          const rows = [];

          for (const item of slotItems) {
            rows.push(rowHtml(item));

            renderedItems.push(item);
          }

          html += `
      <section class="slot-section">

        <h2 class="slot-title">
          ${escapeHtml(slot)}
        </h2>

        <div class="table-shell">
          <div class="table-scroll">

            <table>
              <colgroup>
                <col class="name-col">
                <col class="effect-col">
                <col class="rank-col">
                <col class="xp-col">
              </colgroup>

              <thead>
                <tr>
                  <th>名前 / MOD</th>
                  <th>主効果</th>
                  <th>ランク別追加効果</th>
                  <th>レベルアップ条件</th>
                </tr>
              </thead>

              <tbody>
                ${rows.join("")}
              </tbody>

            </table>

          </div>
        </div>

      </section>
    `;
        }

        if (!html) {
          html = `
      <div class="empty">
        条件に一致するアイテムが見つからぬ。
      </div>
    `;
        }

        content.innerHTML = html;

        if (summary) {
          summary.textContent = `${filtered.length} / ${normalized.length} 件を表示中 — 詳細を開くとRegistry・能力・育成上限を確認できます`;
        }

        renderVersion += 1;

        stopAllAnimations();

        const version = renderVersion;

        const images = Array.from(content.querySelectorAll(".item-image"));

        observeRenderedImages(images, renderedItems, version);
      }

      /* =========================================================
   Filters
   ========================================================= */

      for (const slot of slotOrder) {
        const option = document.createElement("option");

        option.value = slot;

        option.textContent = slot;

        slotFilter.appendChild(option);
      }

      search.addEventListener("input", render);

      slotFilter.addEventListener("change", render);

      modFilter.addEventListener("change", render);

      content.addEventListener("input", (event) => {
        const slider = event.target.closest(".relic-level-slider");
        if (!slider) return;

        const output = slider.closest(".relic-level-control")?.querySelector("[data-level-output]");
        if (!output) return;

        output.textContent = `Lv ${slider.value} / ${slider.max}`;
      });

      render();
    </script>
    <script>
      (() => {
        document.documentElement.classList.add("has-nav-js");

        const nav = document.querySelector(".site-nav");
        const toggle = nav?.querySelector(".site-nav-toggle");
        const links = nav?.querySelector(".site-nav-links");

        if (!nav || !toggle || !links) return;

        const setOpen = (open) => {
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute(
            "aria-label",
            open ? "メニューを閉じる" : "メニューを開く",
          );
          links.classList.toggle("is-open", open);
        };

        setOpen(false);
        toggle.addEventListener("click", () => {
          setOpen(toggle.getAttribute("aria-expanded") !== "true");
        });
        links.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => setOpen(false));
        });
        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") setOpen(false);
        });
        document.addEventListener("click", (event) => {
          if (!nav.contains(event.target)) setOpen(false);
        });

        const media = window.matchMedia("(min-width: 701px)");
        media.addEventListener?.("change", () => setOpen(false));
      })();
    </script>
    <script src="./site.js"></script>
  </body>
</html>
