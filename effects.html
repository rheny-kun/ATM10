<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ATM10 Effects / Potion Effects 早見表</title>
    <link rel="stylesheet" href="./styles.css?v=effects-20261002" />
    <script src="./site.js" defer></script>
  </head>
  <body class="effect-page">
    <header class="site-header">
      <div class="container">
        <h1>ATM10 Effects 早見表</h1>
        <p class="subtitle">All the Mods 10 8.2 / Minecraft 1.21.1 / NeoForge</p>
        <nav class="site-nav" aria-label="サイト内ナビゲーション">
          <button
            class="site-nav-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="site-nav-links"
            aria-label="メニューを開く"
          >
            <span aria-hidden="true">☰</span>
          </button>
          <div class="site-nav-links" id="site-nav-links">
            <a href="./index.html">Relics / Artifacts</a>
            <a href="./enchantments.html">Enchantments</a>
            <a href="./effects.html" class="active" aria-current="page">Effects</a>
          </div>
        </nav>
      </div>
    </header>

    <section class="filter-bar">
      <div class="container filters effect-filters">
        <input
          id="effectSearch"
          class="control"
          type="search"
          placeholder="名前・ID・効果を検索…"
          autocomplete="off"
        />
        <select id="effectModFilter" class="control">
          <option value="">すべてのMOD</option>
        </select>
        <select id="effectCategoryFilter" class="control">
          <option value="">すべての分類</option>
        </select>
        <select id="effectCharmFilter" class="control">
          <option value="">Charm情報すべて</option>
        </select>
        <select id="effectPotionFilter" class="control">
          <option value="">ポーション情報すべて</option>
        </select>
      </div>
    </section>

    <main class="container">
      <div class="table-wrap effect-table">
        <table>
          <colgroup>
            <col class="effect-name-col" />
            <col class="effect-category-col" />
            <col class="effect-description-col" />
            <col class="effect-level-col" />
            <col class="effect-access-col" />
          </colgroup>
          <thead>
            <tr>
              <th>名前 / MOD</th>
              <th>分類</th>
              <th>効果</th>
              <th>Lv / 持続</th>
              <th>Charm / Potion</th>
            </tr>
          </thead>
          <tbody id="effectRows"></tbody>
        </table>
      </div>
    </main>

    <script src="./effects-data.js"></script>
    <script src="./effects.js"></script>
  </body>
</html>
